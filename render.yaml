services:
  - type: web
    name: cinematch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/ping
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false